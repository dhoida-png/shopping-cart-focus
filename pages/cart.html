<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus — Оформлення замовлення</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="page-container single-card-layout">
      <div class="card">
        <div class="card-header-flex">
          <div>
            <h2 class="form-title">Оформлення замовлення</h2>
            <p
              class="form-subtitle"
              style="text-align: left; margin-bottom: 12px"
            >
              <span>Focus</span> - обирай краще!
            </p>
          </div>
          <button id="clearCartBtn" class="btn btn-danger btn-sm">
            Очистити кошик
          </button>
        </div>

        <div id="cartSummary" class="cart-summary-box"></div>

        <label for="customerName" class="field-label">Ім'я покупця:</label>
        <input type="text" id="customerName" placeholder="Введіть ваше ім'я" />

        <div class="checkbox-box" style="margin-top: 14px">
          <label class="checkbox-row">
            <input type="checkbox" id="needsShipping" />
            Доставка кур'єром (безкоштовно від 1500 грн)
          </label>

          <hr
            style="border: none; border-top: 1px solid #e2e8f0; margin: 10px 0"
          />

          <div id="statusGroup" class="status-group">
            <span class="status-title">Ви у нас вже купували?</span>
            <label class="checkbox-row">
              <input type="radio" name="clientStatus" value="regular" />
              Так, я постійний клієнт (+5% знижки)
            </label>
            <label class="checkbox-row">
              <input type="radio" name="clientStatus" value="first_time" />
              Перший раз на сайті
            </label>
            <label class="checkbox-row">
              <input type="radio" name="clientStatus" value="not_client_yet" />
              Ще не ваш(а) клієнт(ка)
            </label>
          </div>
        </div>

        <label for="paymentType" class="field-label" style="margin-top: 12px">
          Спосіб оплати:
        </label>
        <select id="paymentType">
          <option value="cash">Готівка при отриманні</option>
          <option value="card">Оплата карткою онлайн</option>
        </select>

        <div class="button-row" style="margin-top: 16px">
          <button id="calculate" class="btn btn-primary" style="flex: 2">
            Розрахувати замовлення
          </button>
          <button id="resetBtn" class="btn btn-secondary" style="flex: 1">
            Очистити
          </button>
        </div>

        <div id="error" class="error-message"></div>
        <div id="result" class="receipt-box"></div>

        <a href="../index.html" class="btn btn-outline back-home-btn">
          Повернутись на головну
        </a>
      </div>
    </div>

    <script src="../js/index.js"></script>
  </body>
</html>
